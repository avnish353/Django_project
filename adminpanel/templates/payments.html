{% extends "based.html" %}
{% block content %}

<h2 class="mb-3">Payment Logs</h2>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Order</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.id }}</td>
            <td>#{{ log.order.id }}</td>
            <td>₹{{ log.amount }}</td>
            <td>{{ log.method }}</td>
            <td>{{ log.timestamp }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
