{% extends "based.html" %}
{% block content %}

<h2>Dashboard</h2>

<div class="row">
    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h4>Total Orders</h4>
            <p>{{ orders }}</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h4>Menu Items</h4>
            <p>{{ menu_count }}</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h4>Sales</h4>
            <p>{{ sales }}</p>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h4>Users</h4>
            <p>{{ users }}</p>
        </div>
    </div>
</div>

{% endblock %}
