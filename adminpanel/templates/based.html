<!DOCTYPE html>
<html>
<head>
    <title>Smart Canteen Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width: 250px; height: 100vh; position: fixed;">
        <h4 class="text-center mb-4">Admin Panel</h4>

        <ul class="nav flex-column">
            <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link text-white">Dashboard</a></li>
            <li class="nav-item"><a href="{% url 'menu-items' %}" class="nav-link text-white">Menu Items</a></li>
            <li class="nav-item"><a href="{% url 'orders' %}" class="nav-link text-white">Orders</a></li>
            <li class="nav-item"><a href="{% url 'payments' %}" class="nav-link text-white">Payments</a></li>
            <li class="nav-item"><a href="{% url 'announcements' %}" class="nav-link text-white">Announcements</a></li>
            <li class="nav-item"><a href="{% url 'menu' %}" class="nav-link text-white">Menu</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="p-4" style="margin-left: 260px; width: 100%;">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
