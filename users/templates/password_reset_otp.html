{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4169E1, #6a85ff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            width: 100%;
            height:60%;
            max-width: 280px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 25px;
        }

        /* 🔹 Crispy Form Styling */
        label {
            font-weight: 500;
            font-size: 14px;
            color: #34495e;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px 5px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #4169E1;
            box-shadow: 0 0 0 2px rgba(65, 105, 225, 0.2);
        }

        .invalid-feedback,
        .errorlist {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .btn-submit {
            width: 100%;
            background: #4169E1;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: #3558c9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>
    <div class="subtitle">
        Enter the OTP and your new password
    </div>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="form-group">
            {{ form.otp|as_crispy_field }}
        </div>

        <div class="form-group">
            {{ form.new_password|as_crispy_field }}
        </div>

        <div class="form-group">
            {{ form.confirm_password|as_crispy_field }}
        </div>

        <button type="submit" class="btn-submit">
            Reset Password
        </button>
    </form>
</div>

</body>
</html>
