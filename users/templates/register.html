{% load crispy_forms_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div class="card shadow-sm border-0 rounded-4 w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
         <h4 class=" text-center fw-bold m-0" style="color:#4169E1"><img src="{% static "image/Scanteen.png" %}" style="width:40px;height:40px; margin-right:4px;">SmartCanteen</h4>
            <h2 class="fw-bold mb-2">Create your account</h2>
            <p class="text-secondary mb-4">
                Join us and start ordering your favourite food
            </p>

            <form method="post">
                {% csrf_token %}
                {{ register_form|crispy }}

                <button type="submit"
                        class="btn btn-primary w-100 fw-semibold py-2 mt-2 text-white">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-3 small">
                Already have an account?
                <a href="{% url 'login' %}" class="fw-semibold text-primary text-decoration-none">
                    Login
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
