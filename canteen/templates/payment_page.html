{% extends "base.html" %}
{% block title %}Payment | Smart Canteen{% endblock %}

{% block content %}
<div class="container my-5">
    <h2>Payment Page</h2>
    <p><strong>Total Amount to Pay: ₹{{ total }}</strong></p>

    <form method="post" action="{% url 'payment_success' %}">
        {% csrf_token %}

        <!-- ⭐ Bank Dropdown -->
        <div class="mb-3">
            <label for="bank" class="form-label">Select Bank</label>
            <select class="form-select" id="bank" name="bank" required>
                <option value="" selected disabled>-- Choose Bank --</option>
                <option value="SBI">State Bank of India (SBI)</option>
                <option value="HDFC">HDFC Bank</option>
                <option value="ICICI">ICICI Bank</option>
                <option value="AXIS">Axis Bank</option>
                <option value="PNB">Punjab National Bank</option>
                <option value="BOI">Bank of India</option>
                <option value="KOTAK">Kotak Mahindra Bank</option>
                <option value="CANARA">Canara Bank</option>
                <option value="IDBI">IDBI Bank</option>
                <option value="YES">Yes Bank</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="card_number" class="form-label">Card Number</label>
            <input type="text" class="form-control" id="card_number" name="card_number" maxlength="16" required>
        </div>

        <div class="mb-3">
            <label for="cvv" class="form-label">CVV</label>
            <input type="password" class="form-control" id="cvv" name="cvv" maxlength="3" required>
        </div>

        <div class="mb-3">
            <label for="expiry" class="form-label">Expiry Date</label>
            <input type="month" class="form-control" id="expiry" name="expiry" required>
        </div>

        <button type="submit" class="btn btn-success">Pay ₹{{ total }}</button>
    </form>
</div>
{% endblock %}
